<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 236" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif"><title>The GoldLoop: learn in Gold Quest, save spare change with round-ups, build a habit with a SIP, gift gold to someone, and the gift brings in a new saver</title><rect width="1280" height="236" rx="24" fill="#faf6ec"/><rect x="28.0" y="28" width="233.6" height="180" rx="18" fill="#ffffff" stroke="#efe6cf"/><text x="50.0" y="62" fill="#B7791F" font-size="14" font-weight="800" letter-spacing="2.5">1 · LEARN</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="50.0" y="96.0">Gold Quest</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="50.0" y="130.2">Short lessons with XP</tspan><tspan x="50.0" y="151.9">and streaks. Finishing</tspan><tspan x="50.0" y="173.7">them earns a little</tspan><tspan x="50.0" y="195.4">gold.</tspan></text><rect x="275.6" y="28" width="233.6" height="180" rx="18" fill="#ffffff" stroke="#efe6cf"/><text x="297.6" y="62" fill="#B7791F" font-size="14" font-weight="800" letter-spacing="2.5">2 · SAVE</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="297.6" y="96.0">Round-ups</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="297.6" y="130.2">Spare change from every</tspan><tspan x="297.6" y="151.9">purchase becomes gold,</tspan><tspan x="297.6" y="173.7">without thinking about</tspan><tspan x="297.6" y="195.4">it.</tspan></text><rect x="523.2" y="28" width="233.6" height="180" rx="18" fill="#ffffff" stroke="#efe6cf"/><text x="545.2" y="62" fill="#B7791F" font-size="14" font-weight="800" letter-spacing="2.5">3 · HABIT</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="545.2" y="96.0">Gold SIP</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="545.2" y="130.2">From ₹100 a month, once</tspan><tspan x="545.2" y="151.9">the app has earned some</tspan><tspan x="545.2" y="173.7">trust.</tspan></text><rect x="770.8" y="28" width="233.6" height="180" rx="18" fill="#B7791F"/><text x="792.8" y="62" fill="#ffffff" font-size="14" font-weight="800" letter-spacing="2.5">4 · GIFT</text><text fill="#ffffff" font-size="21" font-weight="800" text-anchor="start"><tspan x="792.8" y="96.0">Send gold</tspan></text><text fill="#ffffff" fill-opacity="0.9" font-size="15" font-weight="400" text-anchor="start"><tspan x="792.8" y="130.2">Weddings, festivals,</tspan><tspan x="792.8" y="151.9">birthdays: digital,</tspan><tspan x="792.8" y="173.7">physical or both.</tspan></text><rect x="1018.4" y="28" width="233.6" height="180" rx="18" fill="#ffffff" stroke="#efe6cf"/><text x="1040.4" y="62" fill="#B7791F" font-size="14" font-weight="800" letter-spacing="2.5">5 · LOOP</text><text fill="#1d1b22" font-size="21" font-weight="800" text-anchor="start"><tspan x="1040.4" y="96.0">A new saver</tspan></text><text fill="#6b6670" font-size="15" font-weight="400" text-anchor="start"><tspan x="1040.4" y="130.2">Every gift brings in</tspan><tspan x="1040.4" y="151.9">someone who already</tspan><tspan x="1040.4" y="173.7">owns gold in the app.</tspan></text></svg>